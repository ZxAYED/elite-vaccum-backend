# Local dev stack: just the API, pointed at the same cloud services used in
# production (Neon Postgres + Upstash Redis via DATABASE_URL / REDIS_URL in
# .env). There is no local postgres/redis container to run or keep in sync —
# `docker compose up` here talks to the same database and cache as Render.
name: aryegrunzwieg

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: zxayed/aryegrunzwieg-backend:latest
    container_name: aryegrunzwieg-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      RUN_MIGRATIONS: "true"
    ports:
      - "3000:3000"
